name: Deploy Website via FTP

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --production=false

      - name: Build production assets
        run: npm run build

      - name: Check types and regression tests
        run: |
          npm run lint
          npm test

      - name: Prepare cPanel upload
        run: |
          rm -rf .deploy
          node scripts/prepare-deploy.cjs
          rm -f .deploy/.htaccess

      - name: Check packaged server startup
        run: node scripts/check-deploy.cjs

      - name: Sync built files to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_TARGET }}
          local-dir: ./.deploy/
